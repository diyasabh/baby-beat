<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baby Beat — Prototype flows by Diya Sabharwal</title>
<style>
  :root{
    --ink:#141210; --paper:#EAE8E2; --panel:#F1EFE9; --card:#FBFAF6;
    --muted:#8C877E; --faint:#B7B2A8; --hair:rgba(20,18,16,.10);
    --land:#3A9E56; --land-deep:#2E7E44;
    --alert:#DC3846;
    --sans:-apple-system,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --spring:cubic-bezier(.34,1.28,.64,1); --ease:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);display:flex;overflow:hidden}

  /* sidebar */
  .side{flex:0 0 268px;height:100%;background:var(--panel);border-right:1px solid var(--hair);
    display:flex;flex-direction:column;padding:30px 22px 22px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mark{width:30px;height:30px;flex:0 0 auto;display:block}
  .brand .name{font-size:20px;font-weight:600;letter-spacing:-.01em}
  .eyebrow{margin-top:26px;font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}

  .nav{margin-top:12px;display:flex;flex-direction:column;gap:3px}
  .tab{display:flex;align-items:flex-start;gap:11px;padding:10px 13px;border-radius:11px;cursor:pointer;
    font-size:14.5px;font-weight:500;color:var(--ink);border:1px solid transparent;
    transition:background .18s var(--ease),color .18s,padding-left .18s var(--spring)}
  .tab .idx{font-size:12px;font-weight:700;color:var(--faint);width:16px;flex:0 0 auto;transition:color .18s;padding-top:1px}
  .tab:hover{background:rgba(20,18,16,.045)}
  .tab.on{background:var(--ink);color:var(--paper)}
  .tab.on .idx{color:rgba(255,255,255,.55)}
  .tab .sub{display:block;font-size:11.5px;font-weight:400;color:var(--muted);margin-top:1px}
  .tab.on .sub{color:rgba(255,255,255,.6)}
  .tab .lab{line-height:1.2}

  .switch{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 13px;border:1px solid var(--hair);border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:500}
  .switch:hover{background:rgba(20,18,16,.035)}
  .switch .track{width:36px;height:21px;border-radius:11px;background:rgba(20,18,16,.16);position:relative;
    transition:background .2s var(--ease);flex:0 0 auto}
  .switch .knob{position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s var(--spring)}
  .switch.on .track{background:var(--land)}
  .switch.on .knob{transform:translateX(15px)}
  .switch .k{font-size:11px;color:var(--faint);font-weight:600}

  .side-foot{margin-top:auto;padding-top:20px;font-size:12px;line-height:1.5;color:var(--muted)}
  .side-foot a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--hair)}
  .side-foot a:hover{border-color:var(--land)}

  /* stage */
  .stage{flex:1;position:relative;height:100%;min-width:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:64px 24px 26px}
  .cap{position:absolute;top:22px;left:26px;z-index:5;display:flex;align-items:center;gap:9px;
    font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .cap .dot{width:7px;height:7px;border-radius:50%;background:var(--land);animation:pulse 2s infinite}
  .cap.alert .dot{background:var(--alert);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(58,158,86,.45)}70%{box-shadow:0 0 0 8px rgba(58,158,86,0)}100%{box-shadow:0 0 0 0 rgba(58,158,86,0)}}

  .phone{position:relative;height:min(78vh,760px);aspect-ratio:1179/2556;border-radius:min(6.4vh,58px);
    background:#000;padding:3px;box-shadow:0 26px 60px -18px rgba(20,18,16,.42),0 3px 10px rgba(20,18,16,.13);
    flex:0 0 auto}
  /* every screen is stacked in the same frame, so switching cross-fades in
     place instead of pushing the others down the page */
  .phone img{position:absolute;top:3px;left:3px;
    width:calc(100% - 6px);height:calc(100% - 6px);
    object-fit:cover;border-radius:min(6.1vh,55px);display:block;
    opacity:0;transition:opacity .3s var(--ease)}
  .phone img.on{opacity:1}

  .screenbar{margin-top:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;max-width:min(92vw,780px)}
  .pip{padding:6px 12px;border-radius:999px;border:1px solid var(--hair);background:var(--card);
    font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .18s var(--ease)}
  .pip:hover{border-color:var(--faint);color:var(--ink)}
  .pip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  .legend{position:absolute;right:26px;top:22px;font-size:11.5px;color:var(--faint);letter-spacing:.04em}
  .legend b{color:var(--muted);font-weight:600}

  .narrow{display:none;position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    font-size:11.5px;color:var(--faint);text-align:center;padding:0 20px}
  @media(max-width:1179px){.narrow{display:block}}

  @media(max-width:860px){
    body{flex-direction:column;overflow:auto}
    .side{flex:0 0 auto;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--hair);padding:20px 16px}
    .nav{flex-direction:row;flex-wrap:wrap;gap:6px}
    .tab .sub{display:none}
    .side-foot,.switch{display:none}
    .stage{height:auto;padding:52px 16px 30px}
    .phone{height:62vh}
    .legend{display:none}
  }
</style>
</head>
<body>
  <aside class="side">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 34C20 34 5 25.5 5 15.5 5 10.3 9 6.5 13.7 6.5c2.8 0 5.2 1.4 6.3 3.6 1.1-2.2 3.5-3.6 6.3-3.6C31 6.5 35 10.3 35 15.5c0 10-15 18.5-15 18.5z"
              fill="#FF85A6"/>
        <path d="M6 20.5h6.2l2.4-6 3.6 11 3.2-8 2.2 3h10.4" fill="none" stroke="#FBFAF6"
              stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="name">Baby Beat</span>
    </div>

    <div class="eyebrow">Flows</div>
    <nav class="nav" id="nav"></nav>

    <div class="switch on" id="notesToggle" role="button" tabindex="0">
      <span>Design notes <span class="k">n</span></span>
      <span class="track"><span class="knob"></span></span>
    </div>

    <div class="side-foot">
      An iOS app that reads a heartbeat<br>through the camera and flash.<br><br>
      Designed &amp; built by<br><a href="https://diyasabh.com" target="_blank" rel="noopener">Diya Sabharwal</a>
    </div>
  </aside>

  <main class="stage">
    <div class="cap" id="cap"><span class="dot"></span><span id="capt"></span></div>
    <div class="legend">captured from the iOS simulator &nbsp;·&nbsp; <b>← →</b> to step</div>
    <div class="phone" id="phone"></div>
    <div class="screenbar" id="screenbar"></div>
    <div class="narrow">Design notes need a wider window — they sit in the margins beside the phone.</div>
  </main>

<script src="notes.js"></script>
<script>
/* ── the flows ──────────────────────────────────────────────────────────────
   Each screen names a captured PNG and the notes anchored onto it. Anchors are
   [x,y] as fractions of the phone image, so they survive any window size. */
const FLOWS = [
{
  t:'Onboarding', s:'one question decides the whole app',
  screens:[
    { f:'fresh.jpg', label:'who is holding the phone',
      cap:'Onboarding · the fork',
      notes:[
        {a:[.5,.20],side:'l',t:'the first question is not ‘sign up’. it is <b>who are you to this baby</b> — because the answer changes which half of the app you get'},
        {a:[.5,.42],side:'r',w:250,t:'two roles, two whole apps. a parent literally <b>cannot reach the camera</b>, so nobody takes a reading they were not asked for'},
        {a:[.5,.72],side:'r',t:'‘you can switch views any time’ sits right under the choice. <b>a fork this big needs a visible exit</b>'}
      ]},
    { f:'onboard_parent.jpg', label:'parent setup',
      cap:'Onboarding · parent',
      notes:[
        {a:[.5,.28],side:'l',t:'every field is <b>pre-filled with a real answer</b>, not a placeholder. you can start in one tap and correct later'},
        {a:[.5,.55],side:'r',w:248,t:'a parent names <b>who looks after their baby</b> during setup, because asking someone for a beat is meaningless without a someone'},
        {a:[.5,.74],side:'r',t:'the card spells out what this role can and cannot do <b>before you commit</b> to it'}
      ]},
    { f:'onboard_caregiver.jpg', label:'caregiver setup',
      cap:'Onboarding · caregiver',
      notes:[
        {a:[.5,.30],side:'l',t:'the caregiver names <b>themselves and their room</b> — that is what shows up on the parent’s screen as ‘by miss rosie at little clouds’'},
        {a:[.5,.72],side:'r',t:'same card, opposite promise: <b>you will be the one counting</b>, and you will see when a parent asks'}
      ]}
  ]
},
{
  t:'Parent — everyday', s:'watching, not doing',
  screens:[
    { f:'parent_calm.jpg', label:'a calm beat',
      cap:'Parent · calm',
      notes:[
        {a:[.5,.145],side:'l',w:250,t:'the heart is the real drawing, beating at <b>the exact number under it</b>. 113 ambles, 195 visibly panics'},
        {a:[.5,.29],side:'l',t:'the number is big, but <b>the sentence is the answer</b>. ‘baby is doing just fine’ is what a parent actually came to read'},
        {a:[.5,.395],side:'r',w:242,t:'a mood word, not a chart. <b>‘cozy and steady’ travels further</b> than a bpm range for someone glancing at their phone in a meeting'},
        {a:[.5,.46],side:'r',t:'who took it and how long ago. <b>a reading with no author is not reassuring</b>'},
        {a:[.5,.86],side:'r',t:'the only action a parent gets is <b>asking</b>. it names miss rosie, so it reads as messaging a person, not querying a system'}
      ]},
    { f:'parent_scrolled.jpg', label:'people & meanings',
      cap:'Parent · people & meanings',
      notes:[
        {a:[.5,.115],side:'l',w:246,t:'each caregiver you have added, each with their own ask button. <b>you ask a person, not the app</b>'},
        {a:[.5,.33],side:'r',w:250,t:'the mood words are <b>explained in plain language before red ever appears</b>, so an alert is never the first time you learn what the colours mean'},
        {a:[.5,.50],side:'l',w:252,t:'the quiet policy, stated out loud: <b>a good beat never buzzes your pocket</b>. it lands on the widget, there whenever you want it'},
        {a:[.5,.70],side:'r',w:246,t:'the only notification setting is about <b>silence, not noise</b> — nudge me if a whole stretch of the day goes by with no check at all'}
      ]},
    { f:'parent_waiting.jpg', label:'after asking',
      cap:'Parent · waiting',
      notes:[
        {a:[.5,.115],side:'l',w:248,t:'the ask gets its own banner with a live timer. <b>the anxious state deserves its own screen</b>, not a toast that vanishes'},
        {a:[.5,.87],side:'r',w:246,t:'the button stops being a button. <b>you cannot nag</b> — one ask is out, and the app says so instead of letting you spam a caregiver holding a baby'}
      ]}
  ]
},
{
  t:'Parent — worrying', s:'when the number is wrong',
  screens:[
    { f:'parent_alert.jpg', label:'195 bpm',
      cap:'Parent · alert', alert:true,
      notes:[
        {a:[.5,.145],side:'l',w:250,t:'the same drawn heart, <b>template-tinted red</b>. every crayon stroke survives because the tint uses the artwork’s alpha'},
        {a:[.5,.25],side:'l',t:'the number turns red too. <b>colour is never the only signal</b> — the words change with it'},
        {a:[.5,.325],side:'r',w:248,t:'the reassurance line becomes <b>an instruction</b>: ‘please check on baby now’. the sentence does the work, not the colour'},
        {a:[.36,.735],side:'r',w:244,t:'the timeline dot and the ‘racing’ chip go red at the same instant. <b>one mood, applied everywhere</b>, so nothing contradicts anything'}
      ]},
    { f:'parent_alert__home.jpg', label:'on the home screen',
      cap:'Parent · alert widget', alert:true,
      notes:[
        {a:[.30,.17],side:'l',w:250,t:'the widget flips its whole sky to red. <b>the alert is legible without unlocking</b> — that is the entire point of putting it here'},
        {a:[.30,.24],side:'r',t:'the heart goes white on red, still hand-drawn. <b>same primitive, different weather</b>'},
        {a:[.28,.285],side:'r',w:248,t:'a calm beat <b>never buzzes a pocket</b> — it just lands here. only a worrying one earns a notification. ‘everything is fine’ is not worth interrupting a day for'}
      ]}
  ]
},
{
  t:'Caregiver', s:'answering, and sending home',
  screens:[
    { f:'caregiver_asked.jpg', label:'someone is asking',
      cap:'Caregiver · a parent is waiting',
      notes:[
        {a:[.5,.13],side:'l',w:250,t:'the ask is the <b>first thing on the screen</b>, above the last beat. it is the reason a caregiver opens this app at all'},
        {a:[.5,.175],side:'r',t:'butter yellow, never red. <b>a request is a nudge, not an emergency</b> — the palette has to keep those apart'},
        {a:[.5,.235],side:'r',w:246,t:'‘counting a beat answers everyone waiting’ — <b>one reading clears the whole queue</b>, so nobody counts twice for two parents'},
        {a:[.5,.88],side:'r',t:'the button names who it is for. <b>‘take a beat for mom’</b> beats a generic capture verb'}
      ]},
    { f:'measure_intro.jpg', label:'how to take one',
      cap:'Caregiver · capture',
      notes:[
        {a:[.5,.42],side:'l',w:252,t:'three plain steps, no diagram. the flash is called <b>‘a tiny nightlight’</b> — the phone is about to glow in a dark nap room and that should not alarm anyone'},
        {a:[.5,.60],side:'r',w:244,t:'fifteen seconds is stated up front. <b>holding a baby still is the hard part</b>, so the cost is named before you start'}
      ]},
    { f:'measure_reading.jpg', label:'counting',
      cap:'Caregiver · counting',
      notes:[
        {a:[.5,.30],side:'l',t:'the live wave is <b>the actual signal</b> off the camera, not decoration — you can see when a finger slips'},
        {a:[.5,.52],side:'r',w:246,t:'the count updates as it settles, so <b>the wait is never a blank spinner</b>. and the copy says ‘hold soft and still’, spoken to someone holding a baby'}
      ]},
    { f:'measure_result.jpg', label:'sending it home',
      cap:'Caregiver · sending',
      notes:[
        {a:[.5,.47],side:'l',w:248,t:'the caregiver sees the mood <b>before</b> they send. no silent upload — they know what they are handing over'},
        {a:[.5,.60],side:'r',w:244,t:'the button names the person waiting: <b>‘send it to mom’</b>. and ‘try again’ sits right under it, because a wiggly baby reads high and honest retakes matter'}
      ]},
    { f:'caregiver_alert_sent.jpg', label:'after a worrying beat',
      cap:'Caregiver · alert sent', alert:true,
      notes:[
        {a:[.5,.145],side:'l',w:250,t:'the caregiver sees the same red the parent does. <b>both sides read one truth</b> — no ‘it looked fine on my end’'},
        {a:[.5,.46],side:'r',w:246,t:'the caregiver’s framing is what they <b>sent</b>, not what arrived. same data, same components, different sentence'}
      ]}
  ]
},
{
  t:'Switching sides', s:'one device, both roles',
  screens:[
    { f:'profile.jpg', label:'your account',
      cap:'Profile · switch views',
      notes:[
        {a:[.5,.30],side:'l',t:'who you are, who the baby is, and where. <b>three facts, no settings list</b>'},
        {a:[.5,.52],side:'r',w:248,t:'a parent manages <b>who they are allowed to ask</b> here. adding a caregiver is the only thing that unlocks the ask button'},
        {a:[.5,.80],side:'r',w:250,t:'there is no backend — both roles share one App Group store. that is a prototype limit, but it makes the whole loop <b>demoable on a single phone</b>'}
      ]},
    { f:'caregiver_asked__home.jpg', label:'the caregiver’s widget',
      cap:'Widget · asking',
      notes:[
        {a:[.30,.17],side:'l',w:250,t:'the widget knows which role owns the phone. a caregiver sees <b>the ask</b>, a parent sees the beat — same widget, same code'},
        {a:[.30,.235],side:'r',w:244,t:'a worrying beat <b>always outranks an ask</b>, so red can never hide behind a yellow request'}
      ]}
  ]
}
];

/* ── shell ─────────────────────────────────────────────────────────────── */
const nav=document.getElementById('nav'), phone=document.getElementById('phone'),
      bar=document.getElementById('screenbar'), capt=document.getElementById('capt'),
      capEl=document.getElementById('cap'), toggle=document.getElementById('notesToggle');
const tabs=[], imgs=new Map();
let fi=-1, si=0;

FLOWS.forEach((f,i)=>{
  const b=document.createElement('div'); b.className='tab'; b.setAttribute('role','button');
  b.innerHTML='<span class="idx">'+('0'+(i+1)).slice(-2)+'</span><span class="lab">'+f.t+
              '<span class="sub">'+f.s+'</span></span>';
  b.onclick=()=>showFlow(i,0); nav.appendChild(b); tabs.push(b);
});

/* every screen gets its own <img>, kept around so switching never re-decodes */
function imgFor(file){
  if(imgs.has(file)) return imgs.get(file);
  const im=document.createElement('img');
  im.src='shots/'+file; im.alt=''; im.loading='eager';
  phone.appendChild(im); imgs.set(file,im);
  return im;
}

function showFlow(i,s){
  const changed = i!==fi;
  fi=i; si=s;
  const flow=FLOWS[i], scr=flow.screens[s];

  imgs.forEach(im=>im.classList.remove('on'));
  imgFor(scr.f).classList.add('on');

  tabs.forEach((t,k)=>t.classList.toggle('on',k===i));
  capt.textContent=scr.cap||flow.t;
  capEl.classList.toggle('alert',!!scr.alert);

  if(changed){
    bar.innerHTML='';
    flow.screens.forEach((sc,k)=>{
      const p=document.createElement('div'); p.className='pip'; p.textContent=sc.label;
      p.onclick=()=>showFlow(i,k); bar.appendChild(p);
    });
  }
  [...bar.children].forEach((p,k)=>p.classList.toggle('on',k===s));

  window.BBNotes.show(scr.notes||[]);
  history.replaceState(null,'','#'+i+'.'+s);
}

/* arrows walk every screen in order, across flow boundaries */
function step(d){
  let i=fi,s=si+d;
  while(s<0){ i--; if(i<0){i=0;s=0;break;} s=FLOWS[i].screens.length-1; }
  while(s>=FLOWS[i].screens.length){ s-=FLOWS[i].screens.length; i++; if(i>=FLOWS.length){i=FLOWS.length-1;s=FLOWS[i].screens.length-1;break;} }
  showFlow(i,s);
}
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();step(1);}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();step(-1);}
});

function setToggle(on){ toggle.classList.toggle('on',on); window.BBNotes.setOn(on); }
toggle.onclick=()=>setToggle(!toggle.classList.contains('on'));
toggle.onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle.click();} };
document.addEventListener('bbnotes',e=>toggle.classList.toggle('on',e.detail));

addEventListener('resize',()=>window.BBNotes.position());

const m=(location.hash||'').slice(1).split('.');
showFlow(Math.min(FLOWS.length-1,parseInt(m[0])||0), parseInt(m[1])||0);
</script>
</body>
</html>
