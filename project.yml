name: BabyBeat
options:
  bundleIdPrefix: com.diyasabh
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: TU3QY46Z5S
    CODE_SIGN_STYLE: Automatic
targets:
  BabyBeat:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: BabyBeatWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diyasabh.babybeat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: App/BabyBeat.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.diyasabh.babybeat
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Baby Beat"
        UIAppFonts: [Quicksand.ttf]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchSky
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "The camera watches the glow of a fingertip resting on the lens to count each little heartbeat."
        CFBundleURLTypes:
          - CFBundleURLName: com.diyasabh.babybeat
            CFBundleURLSchemes: [babybeat]
  BabyBeatWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diyasabh.babybeat.widget
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.diyasabh.babybeat
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "Baby Beat"
        UIAppFonts: [Quicksand.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
